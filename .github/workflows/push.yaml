name: golang-pipeline
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    container: golang:1.25.3
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go modules
        run: go mod tidy
          
      - name: Run Unit Tests
        run: go test ./...

      - name: Vet
        run: go vet ./...

 